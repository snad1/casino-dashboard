# Run by the repo's git pre-commit hook (the kit's rule scanner calls `pre-commit run`
# after its own scan). Do not run `pre-commit install`: it would replace that hook.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        files: ^(backend|agent)/
      - id: ruff-format
        args: [--check]
        files: ^(backend|agent)/

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && pnpm exec prettier --check --ignore-unknown "${@#frontend/}"' --
        language: system
        files: ^frontend/
        exclude: ^frontend/pnpm-lock\.yaml$
