[project]
name = "casino-dashboard-api"
version = "0.1.0"
description = "API and ingest worker for the casino dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "redis>=8.1.0",
    "argon2-cffi>=25.1.0",
    "pyotp>=2.11.2",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "hypothesis>=6.170.15",
    "httpx2>=2.16.0",
    "ruff>=0.17.5",
    "mypy>=2.4.1",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261113",
    "testcontainers[postgres]>=4.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
# The local alembic/ directory holds migrations; the import is the installed package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
