<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t">
<title id="t">Terminal: web terminal with session timer and clear read-only or interactive state (desktop)</title>
<style>rect{fill:#8881;stroke:#888;stroke-width:1.5}.hot{stroke-dasharray:6 4;stroke:#c55}.ghost{fill:#8883}text{fill:#888;font:14px ui-sans-serif,system-ui,sans-serif}.h{font-weight:600;font-size:15px}.s{font-size:12px}</style>
<g aria-label="Ticker header"><rect x="0" y="0" width="1280" height="56" rx="6" class=""/>
<text x="10" y="22" class="h">Ticker header</text>
<text x="10" y="42" class="s">wolfbet | balance 0.01234 BTC | session P/L +0.00021 (up arrow, +) | 48.2 bps | status: live / stale / down / events off | 2 s ago</text>
</g>
<g aria-label="Stop all"><rect x="1100" y="10" width="164" height="36" rx="6" class="hot"/>
<text x="1110" y="32" class="h">Stop all</text>
</g>
<g aria-label="Nav"><rect x="0" y="56" width="72" height="744" rx="6" class=""/>
<text x="10" y="78" class="h">Nav</text>
<text x="10" y="98" class="s">Live</text>
<text x="10" y="116" class="s">Control</text>
<text x="10" y="134" class="s">Config</text>
<text x="10" y="152" class="s">Terminal</text>
<text x="10" y="170" class="s">Analytics</text>
<text x="10" y="188" class="s">Alerts</text>
</g>
<g aria-label="Terminal bar"><rect x="88" y="72" width="1176" height="48" rx="6" class=""/>
<text x="98" y="94" class="h">Terminal bar</text>
<text x="98" y="114" class="s">Mode: read-only | interactive (step-up)   Session 04:59 left   [Disconnect]</text>
</g>
<g aria-label="Terminal viewport"><rect x="88" y="136" width="1176" height="648" rx="6" class=""/>
<text x="98" y="158" class="h">Terminal viewport</text>
<text x="98" y="178" class="s">Monospace, fixed size, scrollback</text>
<text x="98" y="196" class="s">Banner: every keystroke is audited</text>
<text x="98" y="214" class="s">Disconnects on idle or when the session ends</text>
</g>
</svg>
