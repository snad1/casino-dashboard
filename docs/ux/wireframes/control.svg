<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t">
<title id="t">Control: per-lane actions, service actions, danger zone and a confirm modal (desktop)</title>
<style>rect{fill:#8881;stroke:#888;stroke-width:1.5}.hot{stroke-dasharray:6 4;stroke:#c55}.ghost{fill:#8883}text{fill:#888;font:14px ui-sans-serif,system-ui,sans-serif}.h{font-weight:600;font-size:15px}.s{font-size:12px}</style>
<g aria-label="Ticker header"><rect x="0" y="0" width="1280" height="56" rx="6" class=""/>
<text x="10" y="22" class="h">Ticker header</text>
<text x="10" y="42" class="s">wolfbet | balance 0.01234 BTC | session P/L +0.00021 (up arrow, +) | 48.2 bps | status: live / stale / down / events off | 2 s ago</text>
</g>
<g aria-label="Stop all"><rect x="1100" y="10" width="164" height="36" rx="6" class="hot"/>
<text x="1110" y="32" class="h">Stop all</text>
</g>
<g aria-label="Nav"><rect x="0" y="56" width="72" height="744" rx="6" class=""/>
<text x="10" y="78" class="h">Nav</text>
<text x="10" y="98" class="s">Live</text>
<text x="10" y="116" class="s">Control</text>
<text x="10" y="134" class="s">Config</text>
<text x="10" y="152" class="s">Terminal</text>
<text x="10" y="170" class="s">Analytics</text>
<text x="10" y="188" class="s">Alerts</text>
</g>
<g aria-label="Lanes"><rect x="88" y="72" width="760" height="300" rx="6" class=""/>
<text x="98" y="94" class="h">Lanes</text>
<text x="98" y="114" class="s">Row per lane: status | session | profit | bps</text>
<text x="98" y="132" class="s">Actions per row: Pause | Resume | Reload</text>
<text x="98" y="150" class="s">Disabled with reason when the role lacks control.basic</text>
<text x="98" y="168" class="s">Lanes count: [3 v] split [even v] -&gt; Preview -&gt; Apply</text>
</g>
<g aria-label="Service"><rect x="88" y="388" width="760" height="160" rx="6" class=""/>
<text x="98" y="410" class="h">Service</text>
<text x="98" y="430" class="s">Start | Stop | Restart (shows job output)</text>
<text x="98" y="448" class="s">Run reset (new run total)</text>
<text x="98" y="466" class="s">Each opens the confirm modal</text>
</g>
<g aria-label="Danger zone"><rect x="88" y="564" width="760" height="160" rx="6" class="hot"/>
<text x="98" y="586" class="h">Danger zone</text>
<text x="98" y="606" class="s">Reset statistics (archives the DB)</text>
<text x="98" y="624" class="s">Needs step-up (2FA within 5 min) and typed confirm</text>
<text x="98" y="642" class="s">Kept apart from everyday buttons</text>
</g>
<g aria-label="Job output"><rect x="864" y="72" width="400" height="300" rx="6" class=""/>
<text x="874" y="94" class="h">Job output</text>
<text x="874" y="114" class="s">Streaming lines (stdout / stderr)</text>
<text x="874" y="132" class="s">Exit code and duration at the end</text>
</g>
<g aria-label="Confirm modal (destructive)"><rect x="864" y="388" width="400" height="336" rx="6" class="ghost"/>
<text x="874" y="410" class="h">Confirm modal (destructive)</text>
<text x="874" y="430" class="s">Title: Reset statistics for wolfbet?</text>
<text x="874" y="448" class="s">Body: archives the current DB and starts</text>
<text x="874" y="466" class="s">fresh. Sessions stay in the archive.</text>
<text x="874" y="484" class="s">Type wolfbet to confirm: [________]</text>
<text x="874" y="502" class="s">[Cancel]        [Reset statistics]</text>
</g>
</svg>
