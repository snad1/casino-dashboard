<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t">
<title id="t">Analytics: filters, KPI tiles, charts and export (desktop)</title>
<style>rect{fill:#8881;stroke:#888;stroke-width:1.5}.hot{stroke-dasharray:6 4;stroke:#c55}.ghost{fill:#8883}text{fill:#888;font:14px ui-sans-serif,system-ui,sans-serif}.h{font-weight:600;font-size:15px}.s{font-size:12px}</style>
<g aria-label="Ticker header"><rect x="0" y="0" width="1280" height="56" rx="6" class=""/>
<text x="10" y="22" class="h">Ticker header</text>
<text x="10" y="42" class="s">wolfbet | balance 0.01234 BTC | session P/L +0.00021 (up arrow, +) | 48.2 bps | status: live / stale / down / events off | 2 s ago</text>
</g>
<g aria-label="Stop all"><rect x="1100" y="10" width="164" height="36" rx="6" class="hot"/>
<text x="1110" y="32" class="h">Stop all</text>
</g>
<g aria-label="Nav"><rect x="0" y="56" width="72" height="744" rx="6" class=""/>
<text x="10" y="78" class="h">Nav</text>
<text x="10" y="98" class="s">Live</text>
<text x="10" y="116" class="s">Control</text>
<text x="10" y="134" class="s">Config</text>
<text x="10" y="152" class="s">Terminal</text>
<text x="10" y="170" class="s">Analytics</text>
<text x="10" y="188" class="s">Alerts</text>
</g>
<g aria-label="Filters"><rect x="88" y="72" width="1176" height="56" rx="6" class=""/>
<text x="98" y="94" class="h">Filters</text>
<text x="98" y="114" class="s">Date range | lane | strategy | [Apply]   [Export CSV]</text>
</g>
<g aria-label="KPI: profit"><rect x="88" y="144" width="280" height="120" rx="6" class=""/>
<text x="98" y="166" class="h">KPI: profit</text>
<text x="98" y="186" class="s">+0.0042 (arrow, sign)</text>
<text x="98" y="204" class="s">vs previous period</text>
</g>
<g aria-label="KPI: ROI %"><rect x="384" y="144" width="280" height="120" rx="6" class=""/>
<text x="394" y="166" class="h">KPI: ROI %</text>
<text x="394" y="186" class="s">profit / wagered x 100</text>
</g>
<g aria-label="KPI: bets"><rect x="680" y="144" width="280" height="120" rx="6" class=""/>
<text x="690" y="166" class="h">KPI: bets</text>
<text x="690" y="186" class="s">count and bps avg</text>
</g>
<g aria-label="KPI: max drawdown"><rect x="976" y="144" width="288" height="120" rx="6" class=""/>
<text x="986" y="166" class="h">KPI: max drawdown</text>
<text x="986" y="186" class="s">from peak balance</text>
</g>
<g aria-label="Profit by day"><rect x="88" y="280" width="584" height="504" rx="6" class=""/>
<text x="98" y="302" class="h">Profit by day</text>
<text x="98" y="322" class="s">Bars from bets_1d, colour + sign</text>
</g>
<g aria-label="Sessions table"><rect x="688" y="280" width="576" height="504" rx="6" class=""/>
<text x="698" y="302" class="h">Sessions table</text>
<text x="698" y="322" class="s">Sortable, keyset paging</text>
<text x="698" y="340" class="s">Matches wolfbet --analytics</text>
</g>
</svg>
