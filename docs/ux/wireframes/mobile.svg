<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="t">
<title id="t">Mobile: compact ticker, stacked lane cards, chart and a bottom tab bar (390 wide)</title>
<style>rect{fill:#8881;stroke:#888;stroke-width:1.5}.hot{stroke-dasharray:6 4;stroke:#c55}.ghost{fill:#8883}text{fill:#888;font:14px ui-sans-serif,system-ui,sans-serif}.h{font-weight:600;font-size:15px}.s{font-size:12px}</style>
<g aria-label="Ticker"><rect x="0" y="0" width="390" height="64" rx="6" class=""/>
<text x="10" y="22" class="h">Ticker</text>
<text x="10" y="42" class="s">P/L +0.00021 (arrow) | live | 48 bps</text>
</g>
<g aria-label="Stop all"><rect x="300" y="14" width="76" height="36" rx="6" class="hot"/>
<text x="310" y="36" class="h">Stop all</text>
</g>
<g aria-label="Chart"><rect x="12" y="76" width="366" height="220" rx="6" class=""/>
<text x="22" y="98" class="h">Chart</text>
<text x="22" y="118" class="s">res and range in one row</text>
<text x="22" y="136" class="s">profit | balance toggle</text>
</g>
<g aria-label="Lane 1 card"><rect x="12" y="308" width="366" height="120" rx="6" class=""/>
<text x="22" y="330" class="h">Lane 1 card</text>
<text x="22" y="350" class="s">running | +0.0002 | 18 bps</text>
<text x="22" y="368" class="s">[Pause]  (44 px targets)</text>
</g>
<g aria-label="Lane 2 card"><rect x="12" y="440" width="366" height="120" rx="6" class=""/>
<text x="22" y="462" class="h">Lane 2 card</text>
<text x="22" y="482" class="s">stale | events off notice</text>
</g>
<g aria-label="Tape (collapsed)"><rect x="12" y="572" width="366" height="180" rx="6" class=""/>
<text x="22" y="594" class="h">Tape (collapsed)</text>
<text x="22" y="614" class="s">Last 5 bets, tap to open full tape</text>
</g>
<g aria-label="Tab bar"><rect x="0" y="772" width="390" height="72" rx="6" class=""/>
<text x="10" y="794" class="h">Tab bar</text>
<text x="10" y="814" class="s">Live | Sessions | Control | Alerts</text>
</g>
</svg>
