title = "casino-dashboard"

[extend]
useDefault = true

[allowlist]
description = "Generated or third-party trees that hold no secrets of ours"
paths = [
  # Dependency and build output: scanned upstream, regenerated on install.
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.svelte-kit/''',
  '''(^|/)frontend/build/''',
  '''(^|/)\.(mypy|ruff|pytest)_cache/''',
  # Playwright and ZAP output: page snapshots hold the throwaway e2e stack's password.
  '''(^|/)frontend/(test-results|playwright-report)/''',
  '''(^|/)zap-results/''',
  # Lockfiles carry integrity hashes that look like keys.
  '''(^|/)uv\.lock$''',
  '''(^|/)pnpm-lock\.yaml$''',
]
