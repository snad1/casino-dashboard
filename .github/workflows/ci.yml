name: ci

# Lint, types, tests and security scans: the same Makefile targets as `make check`.
# A tree that already passed (same file contents, any branch) is not verified again.

on:
  push:
    branches: [main, feat/casino-dashboard]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  HADOLINT_VERSION: 2.15.1
  HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
  TRIVY_VERSION: 0.76.2
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Already verified?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_SALT: ci-v1
        run: bash .github/scripts/verified_tree.sh

      - name: Set up uv
        if: steps.gate.outputs.verified != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.8

      - name: Set up pnpm
        if: steps.gate.outputs.verified != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        if: steps.gate.outputs.verified != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install scanners (checksums verified)
        if: steps.gate.outputs.verified != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C bin gitleaks
          curl -fsSLo bin/hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  bin/hadolint" | sha256sum -c -
          chmod +x bin/hadolint
          curl -fsSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz -C bin trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.gate.outputs.verified != 'true'
        run: make install

      - name: Lint
        if: steps.gate.outputs.verified != 'true'
        run: make lint

      - name: Types
        if: steps.gate.outputs.verified != 'true'
        run: make type

      - name: Tests
        if: steps.gate.outputs.verified != 'true'
        run: make test

      - name: Security scans
        if: steps.gate.outputs.verified != 'true'
        run: make security

      - name: Mark verified
        if: steps.gate.outputs.verified != 'true'
        run: echo "${{ github.sha }}" > verified.txt

      - name: Upload verified marker
        if: steps.gate.outputs.verified != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.gate.outputs.marker }}
          path: verified.txt
          retention-days: 30
