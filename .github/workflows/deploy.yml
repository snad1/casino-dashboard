name: deploy

# Push-to-deploy for wolfbet-dashboard, with Coolify as the system of record.
# On a push to feat/casino-dashboard: wait for this commit's ci run and stop unless it passed,
# build both images, push them to GHCR as <sha> and latest, point Coolify's IMAGE_TAG at the
# sha, deploy, wait until every container is healthy, then check the public health endpoints.
# A failed migration keeps api, ingest and mailer from starting, so the app never turns
# healthy and this run fails. (workflow_run would only fire from the default branch.)

on:
  push:
    branches: [feat/casino-dashboard]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: deploy-wolfbet-dashboard
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/snad1
  SHA: ${{ github.sha }}
  COOLIFY_URL: ${{ vars.COOLIFY_URL }}
  COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
  PUBLIC_URL: ${{ vars.PUBLIC_URL }}

jobs:
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for this commit's ci run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 240); do
            run=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") echo "ci passed for $SHA"; exit 0 ;;
              completed*) echo "ci $run for $SHA; not deploying"; exit 1 ;;
            esac
            sleep 10
          done
          echo "ci did not finish for $SHA"; exit 1

  images:
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Sign in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the api image
        run: |
          docker buildx build --push \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$SHA" \
            -t "$REGISTRY/casino-dashboard-api:$SHA" -t "$REGISTRY/casino-dashboard-api:latest" \
            backend

      - name: Build and push the caddy image
        run: |
          docker buildx build --push \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$SHA" \
            -t "$REGISTRY/casino-dashboard-caddy:$SHA" -t "$REGISTRY/casino-dashboard-caddy:latest" \
            -f deploy/caddy/Dockerfile frontend

  coolify:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Point Coolify at this commit's images
        run: |
          curl -fsS -X PATCH "$COOLIFY_URL/api/v1/applications/$COOLIFY_APP_UUID/envs" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Content-Type: application/json" \
            -d "{\"key\":\"IMAGE_TAG\",\"value\":\"$SHA\"}" > /dev/null

      - name: Deploy and wait for it to finish
        run: |
          api() { curl -fsS --max-time 30 -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/$1"; }
          deployment=$(api "deploy?uuid=$COOLIFY_APP_UUID&force=false" | jq -r '.deployments[0].deployment_uuid')
          [ -n "$deployment" ] && [ "$deployment" != null ] || { echo "Coolify queued no deployment"; exit 1; }
          echo "Coolify deployment $deployment"
          for _ in $(seq 60); do
            status=$(api "deployments/$deployment" | jq -r .status)
            case "$status" in
              finished) echo "Deployment finished"; exit 0 ;;
              failed|cancelled*)
                echo "Deployment $status. Coolify log:"
                api "deployments/$deployment" | jq -r '.logs | fromjson? // [] | .[] | select(.hidden | not) | .output' | tail -60
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Deployment still $status after 10 minutes"; exit 1

      - name: Wait until every container is healthy
        run: |
          for _ in $(seq 30); do
            status=$(curl -fsS --max-time 30 -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/applications/$COOLIFY_APP_UUID" | jq -r .status)
            [ "$status" = "running:healthy" ] && { echo "App $status"; exit 0; }
            sleep 10
          done
          echo "App is $status, not running:healthy, after 5 minutes"; exit 1

      - name: Check the public health endpoints
        run: |
          for path in /healthz /health; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$PUBLIC_URL$path")
            echo "$path $code"
            [ "$code" = 200 ] || exit 1
          done
