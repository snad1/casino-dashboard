name: e2e-stack

# Playwright against the real stack (Caddy, api, Timescale, Redis) with replayed bot events,
# on desktop and phone viewports, plus Lighthouse. Slow, so it runs on pull requests to main
# and nightly; pushes keep the fast stubbed suite in ci.yml. A tree that already passed this
# workflow is not run again.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Already verified?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_SALT: e2e-stack-v1
        run: bash .github/scripts/verified_tree.sh

      - name: Set up pnpm
        if: steps.gate.outputs.verified != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        if: steps.gate.outputs.verified != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: steps.gate.outputs.verified != 'true'
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Stack tests
        if: steps.gate.outputs.verified != 'true'
        run: make e2e-stack

      - name: Upload report
        if: failure() && steps.gate.outputs.verified != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-stack-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Mark verified
        if: steps.gate.outputs.verified != 'true'
        run: echo "${{ github.sha }}" > verified.txt

      - name: Upload verified marker
        if: steps.gate.outputs.verified != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.gate.outputs.marker }}
          path: verified.txt
          retention-days: 30
