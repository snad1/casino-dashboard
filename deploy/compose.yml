name: ${COMPOSE_PROJECT_NAME:-wolfbet-dashboard}

x-hardening: &hardening
  restart: unless-stopped
  cpu_shares: 256
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-app: &app
  <<: *hardening
  build:
    context: ../backend
  image: casino-dashboard-api:local
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  networks:
    - internal
  environment:
    APP_ENV: production

services:
  timescale:
    <<: *hardening
    image: timescale/timescaledb:2.32.0-pg16
    cpus: 1.0
    mem_limit: 1g
    shm_size: 256m
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TIMESCALEDB_TELEMETRY: "off"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=50
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    <<: *hardening
    image: redis:7.4.12-alpine
    cpus: 0.25
    mem_limit: 320m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    user: "999:1000"
    entrypoint: ["/bin/sh", "/etc/redis/entrypoint.sh"]
    secrets:
      - redis_publisher_password
      - redis_dashboard_password
    volumes:
      - ./redis/users.acl.tmpl:/etc/redis/users.acl.tmpl:ro
      - ./redis/entrypoint.sh:/etc/redis/entrypoint.sh:ro
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - internal
      - hostlink
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user dashboard --pass \"$$(cat /run/secrets/redis_dashboard_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *app
    cpus: 1.0
    mem_limit: 512m
    environment:
      APP_ENV: production
      PUBLIC_HOST: ${WOLFBET_HOST:?set WOLFBET_HOST in deploy/.env}
      POSTGRES_HOST: timescale
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard_app
      REDIS_HOST: redis
      REDIS_USER: dashboard
    secrets:
      - session_secret
      - totp_key
      - source: postgres_app_password
        target: postgres_password
      - redis_dashboard_password
    depends_on:
      timescale:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  ingest:
    <<: *app
    cpus: 0.5
    mem_limit: 256m
    command: ["python", "-m", "app.ingest"]
    volumes:
      - ${BOT_DATA_DIR:?set BOT_DATA_DIR in deploy/.env}:/botdata:ro
    depends_on:
      timescale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/ingest.alive') < 90 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  mailer:
    <<: *app
    cpus: 0.25
    mem_limit: 128m
    command: ["python", "-m", "app.mail.worker"]
    environment:
      APP_ENV: production
      POSTGRES_HOST: timescale
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard_app
      MAIL_BACKEND: brevo
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in deploy/.env}
    secrets:
      - source: postgres_app_password
        target: postgres_password
      - brevo_api_key
    networks:
      - internal
      - egress
    depends_on:
      timescale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/mailer.alive') < 60 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  # One-shot: `docker compose run --rm migrate`. The only container with the owner password.
  migrate:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    cpus: 0.5
    mem_limit: 256m
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: production
      POSTGRES_HOST: timescale
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
    secrets:
      - postgres_password
      - postgres_app_password
    depends_on:
      timescale:
        condition: service_healthy

  caddy:
    <<: *hardening
    image: caddy:2.11.9-alpine
    cpus: 0.25
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      WOLFBET_HOST: ${WOLFBET_HOST:?set WOLFBET_HOST in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/build:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2020/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  internal:
    internal: true
  edge: {}
  hostlink: {}
  egress: {}

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  session_secret:
    file: ./secrets/session_secret.txt
  brevo_api_key:
    file: ./secrets/brevo_api_key.txt
  totp_key:
    file: ./secrets/totp_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_app_password:
    file: ./secrets/postgres_app_password.txt
  redis_publisher_password:
    file: ./secrets/redis_publisher_password.txt
  redis_dashboard_password:
    file: ./secrets/redis_dashboard_password.txt
