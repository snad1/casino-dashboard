[project]
name = "casino-dashboard-agent"
version = "0.1.0"
description = "Host control agent for the casino dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "hypothesis>=6.170.15",
    "ruff>=0.17.5",
    "mypy>=2.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
